<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'self'; media-src 'self'">
  <title>깨비 · 졸음부터 다시 출발까지</title>
  <link rel="stylesheet" href="journey.css">
  <script defer src="../vendor/three.min.js"></script>
  <script defer src="tour.js"></script>
  <script defer src="story-data.js"></script>
  <script defer src="journey-scene.js"></script>
  <script defer src="journey.js"></script>
</head>
<body data-runtime="journey">
<canvas id="stage" aria-label="밤길을 달리던 차가 쉼터에 멈추고 실내가 수면 환경으로 바뀌는 모형 장면"></canvas>
<div class="shade" aria-hidden="true"></div>

<header class="top">
  <a id="exit" class="exit" href="kkaebi://exit-demo" aria-label="깨비 앱으로 돌아가기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"></path></svg></a>
  <strong class="brand">깨비</strong>
  <span class="disclosure">통합 시나리오 · 모형 시연</span>
  <span id="status" class="status" role="status"></span>
  <a class="details" href="index.html">하드웨어 상세</a>
</header>

<div class="heading">
  <h1 id="title">졸음이 오면, 깨비</h1>
  <p id="detail">쉼터 안내부터 휴식과 다시 출발까지</p>
</div>

<div id="rest" class="rest" hidden>
  <strong id="rest-clock">20:00</strong>
  <span>20분 휴식 · 시간을 줄여 보여 줍니다</span>
</div>

<div id="labels" class="labels" aria-hidden="true">
  <svg id="leaders" class="leaders"></svg>
</div>
<ol id="hardware" class="sr-only" aria-label="각 하드웨어의 모의 진행 상태"></ol>

<footer class="dock">
  <div id="caption" class="caption">
    <img id="companion" src="../../character/kkaebi-attentive.webp" width="56" height="56" alt="">
    <strong id="caption-speaker">깨비</strong>
    <p id="caption-text">졸리면, 쉬어 갈 수 있도록.</p>
    <span class="voice" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </div>
  <div class="transport">
    <div id="timeline" class="timeline" role="slider" tabindex="0" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="150" aria-valuenow="0">
      <span class="track"><span id="fill" class="fill"></span></span>
      <ol id="chapters" class="chapters"></ol>
    </div>
    <span id="time" class="time">0:00 / 2:30</span>
    <button id="restart" class="ghost">처음부터</button>
    <button id="play" class="primary">통합 여정 시작</button>
  </div>
  <p class="notes"><span id="host">브라우저 시연</span> · 경로·대화·도착은 작성한 시나리오 · 차량 제어 없음 · 모형값, 창문 동작은 시연 전용</p>
</footer>
<div id="notice" class="notice" role="status" hidden></div>
<audio id="audio" preload="auto"></audio>
<div id="live" class="sr-only" aria-live="polite"></div>
</body>
</html>
