<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'self'"><title>깨비 · 여정 사이의 쉼</title><link rel="stylesheet" href="style.css"><script defer src="core.js"></script><script defer src="sleep-routine.js"></script><script defer src="scene-state.js"></script><script defer src="scene.js"></script><script defer src="app.js"></script></head>
<body><div class="app"><header class="topbar"><button class="brand" data-action="home" aria-label="깨비 홈">깨비</button><nav class="journey-nav" aria-label="여정"><button data-action="planning">출발 계획</button><button data-action="drowsy-mode">졸음모드</button><button data-action="rest-mode">휴식</button></nav><nav class="tools" aria-label="도구"><button id="sound" class="icon-button" aria-label="음성 안내 켜기"></button><button data-action="journal" class="icon-button" aria-label="휴식 기록" id="journal-button"></button></nav></header>
<main class="workspace"><section class="cabin-stage" aria-label="차량 공간 미리보기"><div class="scene-copy"><h2 id="scene-title">나에게 맞는 공간</h2><p id="scene-message">한 번 시작하면 저장한 수면 환경을 차례로 준비해요.</p><div id="countdown" class="countdown" hidden></div></div><div class="scene-viewport"><canvas id="cabin-canvas" aria-label="선택값으로 움직이는 차량 공간 모형"></canvas></div><div class="scene-footer"><span id="scene-caption">설정 미리보기<small>실제 차량 상태와 다를 수 있어요</small></span><img id="companion" src="../character/kkaebi-attentive.webp" alt="" aria-hidden="true" width="64" height="64"></div></section><section class="control-panel" aria-label="여정과 환경 설정"><div id="panel-content"></div></section></main>
<div class="action-dock"><div id="dock-copy"></div><div id="dock-actions" class="dock-actions"></div></div><div class="statusline"><span id="connection" role="status"></span><span id="vehicle"></span><span id="runtime-note">졸리면 안전한 곳에서 쉬어 주세요.</span></div></div>
<aside id="simulator" aria-label="브라우저 시연"><span>브라우저 시뮬레이션 · 차량 제어 없음</span><div><button data-sim="park">P단 정차</button><button data-sim="drive">주행</button><button data-sim="lost">신호 단절</button><button data-sim="wake">알람 울리기</button><button data-sim="reset">처음으로</button></div></aside><div id="live-notice" class="sr-only" aria-live="polite"></div></body></html>
